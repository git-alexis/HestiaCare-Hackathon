<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Connection - HestiaCare</title>

    <link type="text/css" rel="stylesheet" href="../assets/styles/login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=[object Object]&display=swap" />
    <script type="text/javascript" src="../assets/script.js" defer></script>
</head>

<body>
    <div class="login-container">
        <div class="login-formula">
            <div class="logo">
                <img src="../assets/images/logo_orange.png" alt="HestiaCare">
            </div>
            <h1 class="login-title">Connection</h1>

            <form id="login-form">
                <label>Email</label>
                <input type="email" id="email" placeholder="Email" required><br>
                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Se souvenir de moi</label>
                </div>

                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Mot de passe" required><br>

                <p class="signup">Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
                <button type="button" onclick="login()">Se connecter</button>
            </form>
            <p id="message"></p>
        </div>
        <div class="login-img"></div>
    </div>
</body>

</html>
