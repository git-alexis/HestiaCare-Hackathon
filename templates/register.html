<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Créer un compte - HestiaCare</title>
    <link type="text/css" rel="stylesheet" href="../assets/styles/register.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=[object Object]&display=swap" />
    <script type="text/javascript" src="../assets/script.js" defer></script>
</head>

<body>
    <div class="signup-container">
        <div class="signup-box">
            <div class="logo">
                <img src="../assets/images/logo_orange.png" alt="HestiaCare">
            </div>

            <h1>Créer un compte</h1>
            <form id="register-form">
                <label>Prénom</label>
                <input type="text" id="first_name" placeholder="Prénom" required><br>

                <label>Nom</label>
                <input type="text" id="last_name" placeholder="Nom" required><br>

                <label>Email</label>
                <input type="email" id="email" placeholder="Email" required><br>

                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Mot de passe" required><br>

                <p class="login-link">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
    
                <button type="button" onclick="createAccount()">Créer mon compte</button>
            </form>
            <p id="message"></p>
        </div>
        <div class="signup-img"></div>
    </div>
</body>

</html>
